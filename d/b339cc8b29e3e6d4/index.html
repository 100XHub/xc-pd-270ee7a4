<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#070b12"/>
<title>100XClub Partner Dashboard</title>
<link rel="icon" href="assets/brand/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" href="assets/brand/favicon-32.png" sizes="32x32"/>
<link rel="apple-touch-icon" href="assets/brand/logo-128.png"/>
<style>
:root{
  --bg:#070b12; --bg2:#0c121c; --card:#121a26; --card2:#162032;
  --line:#243247; --text:#eef3fb; --muted:#8fa0b8; --faint:#617289;
  --accent:#14b8a6; --accent2:#0d9488; --accent-glow:rgba(20,184,166,.22);
  --ok:#22c55e; --bad:#f43f5e; --warn:#f59e0b;
  --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --teal:#14b8a6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:radial-gradient(1200px 600px at 10% -10%,#0f2a28 0%,var(--bg) 55%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
.hidden{display:none!important}

.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-card{width:min(420px,100%);background:linear-gradient(180deg,rgba(20,184,166,.06),transparent),var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px 24px;box-shadow:var(--shadow)}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.brand-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--accent-glow);display:block}
.gate h1{margin:0;font-size:1.25rem}
.gate p{margin:8px 0 0;color:var(--muted);font-size:.92rem}
.gate input{width:100%;margin-top:18px;padding:14px 14px;border-radius:12px;border:1px solid var(--line);background:#0a1018;color:var(--text);outline:none}
.gate input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.gate .btn{width:100%;margin-top:12px;padding:13px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#041210;font-weight:800;cursor:pointer}
.gate .btn:active{transform:translateY(1px)}
.err{min-height:1.2em;margin-top:10px;color:var(--bad);font-size:.85rem}

.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 72px}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.topbar h1{margin:0;font-size:clamp(1.25rem,3vw,1.65rem);letter-spacing:-.02em}
.topbar .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:.78rem}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}

.section{margin-top:22px}
.section-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-head h2{margin:0;font-size:1rem;font-weight:700}
.section-head .hint{color:var(--faint);font-size:.8rem}

.row-label{color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px}

.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.grid,.grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid,.grid.cols-4{grid-template-columns:1fr}}

.card{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset;min-width:0}
.card.clickable{cursor:pointer;transition:border-color .15s, box-shadow .15s, transform .15s}
.card.clickable:hover,.card.clickable.open{border-color:rgba(20,184,166,.55);box-shadow:0 0 0 3px var(--accent-glow);transform:translateY(-1px)}
.card .label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.card .big{margin-top:8px;font-size:clamp(1.2rem,2.4vw,1.5rem);font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .na-note{margin-top:8px;color:var(--faint);font-size:.78rem;line-height:1.35}
.card .tap-hint{margin-top:6px;color:var(--faint);font-size:.7rem}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:3px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.pill.up,.pill.new{color:#bbf7d0;background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.28)}
.pill.down{color:#fecdd3;background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.28)}
.pill.flat{color:var(--muted);background:rgba(255,255,255,.04);border-color:var(--line)}

.breakdown{margin-top:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(10,16,24,.55)}
.breakdown .bd-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(36,50,71,.7)}
.breakdown .bd-row:last-child{border-bottom:0}
.breakdown img{width:28px;height:28px;border-radius:8px;object-fit:contain;background:#0a1018;flex:0 0 auto}
.breakdown .bd-name{flex:1;font-weight:600;font-size:.9rem}
.breakdown .bd-val{font-weight:800;font-variant-numeric:tabular-nums}

.seg{display:inline-flex;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.8rem;font-weight:600}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#041210}

.charts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
.trend-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:800px){.trend-charts{grid-template-columns:1fr}}
.chart-card .title{font-weight:700;font-size:.92rem;margin-bottom:8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chart-card .title .tot{color:var(--muted);font-weight:600;font-size:.8rem;letter-spacing:0}
.chart-card svg{width:100%;height:220px;display:block}
.bar-na{font-size:.75rem;fill:var(--faint)}

.ex-tiles{display:flex;flex-wrap:wrap;gap:10px}
.ex-tile{display:flex;flex-direction:column;align-items:center;gap:8px;width:104px;padding:12px 10px 10px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;color:var(--muted);transition:border-color .15s, box-shadow .15s, transform .15s}
.ex-tile:hover{border-color:rgba(20,184,166,.45);transform:translateY(-1px)}
.ex-tile.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);color:var(--text);background:rgba(20,184,166,.08)}
.ex-tile img{width:44px;height:44px;border-radius:12px;object-fit:contain;background:#0a1018}
.ex-tile .nm{font-size:.78rem;font-weight:700}
.ex-tile .st{font-size:.65rem;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.ex-tile.on .st{color:var(--accent)}

.empty{padding:36px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);background:rgba(255,255,255,.02);color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:1.05rem;margin-bottom:6px}

.footer{margin-top:28px;color:var(--faint);font-size:.78rem}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="brand-row">
      <img class="brand-logo" src="assets/brand/logo-128.png" alt="100XClub"/>
      <div>
        <h1>100XClub Partner Dashboard</h1>
        <p>Affiliate performance across exchanges</p>
      </div>
    </div>
    <p>Enter your access code to decrypt and view the live totals.</p>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="Access code" autofocus/>
    <button class="btn" id="unlock" type="button">Unlock dashboard</button>
    <div id="err" class="err"></div>
  </div>
</div>

<div id="app" class="wrap hidden"></div>

function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function deriveKey(password, salt, iterations){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function decryptPayload(password){
  const salt=b64(ENC.salt), iv=b64(ENC.iv), ct=b64(ENC.ct);
  const key=await deriveKey(password, salt, ENC.iter||210000);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}

function money(n){
  if(n===null||n===undefined||Number.isNaN(n)) return '—';
  const a=Math.abs(n);
  if(a>=1e6) return '$'+(n/1e6).toFixed(a>=1e7?1:2).replace(/\.0$/,'')+'M';
  if(a>=1e3) return '$'+Math.round(n).toLocaleString('en-US');
  return '$'+Number(n).toFixed(2);
}
function compactMoney(n){
  if(n===null||n===undefined||Number.isNaN(n)) return '—';
  const a=Math.abs(n), sign=n<0?'-':'';
  if(a>=1e6){ const v=a/1e6; const s=(v>=10?v.toFixed(1):v.toFixed(2)).replace(/\.0$/,''); return sign+'$'+s+'M'; }
  if(a>=1e3){ const v=a/1e3; const s=(v>=100?String(Math.round(v)):(v.toFixed(v>=10?1:2))).replace(/\.0$/,''); return sign+'$'+s+'k'; }
  if(a>=100) return sign+'$'+Math.round(a);
  return sign+'$'+Number(a).toFixed(a>=10?1:2);
}
function intfmt(n){
  if(n===null||n===undefined||Number.isNaN(n)) return '—';
  return Math.round(n).toLocaleString('en-US');
}
function compactInt(n){
  if(n===null||n===undefined||Number.isNaN(n)) return '—';
  const a=Math.abs(n), sign=n<0?'-':'';
  if(a>=1e6) return sign+(a/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(a>=1e3) return sign+(a/1e3).toFixed(a>=10000?0:1).replace(/\.0$/,'')+'k';
  return sign+String(Math.round(a));
}
function fmt(n, kind){ return kind==='int' ? intfmt(n) : money(n); }
function compactFmt(n, kind){ return kind==='int' ? compactInt(n) : compactMoney(n); }
function pctText(pct, direction){
  if(direction==='new') return 'new';
  if(pct===null||pct===undefined) return '—';
  const sign = pct>0 ? '+' : '';
  return sign + pct.toFixed(1) + '%';
}
function arrow(direction){
  if(direction==='up' || direction==='new') return '↑';
  if(direction==='down') return '↓';
  return '→';
}
function pill(direction, pct){
  const d = direction || 'flat';
  return `<span class="pill ${d}">${arrow(d)} ${pctText(pct, d)}</span>`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function displayLabel(label, mode){
  if(label==='FTD') return (mode==='24h'||mode==='daily') ? 'FTDs' : 'FTD';
  return label;
}

function isComparable(m, mode){
  if(m.hide_pill || m.label==='AUM') return false;
  if(mode==='24h') return m.comparable_24h === true;
  return m.comparable_mtd === true;
}
function modeValue(m, mode){
  if(mode==='24h') return (m.daily!=null ? m.daily : m.last_24h);
  return m.mtd;
}
function modeUnavailable(m, mode){
  if(m.unavailable) return true;
  if(mode==='24h') return m.daily_unavailable===true || modeValue(m, mode)==null;
  return m.mtd_unavailable===true || modeValue(m, mode)==null;
}

function metricCards(metrics, mode, opts){
  opts = opts || {};
  const clickable = !!opts.clickable;
  const n = (metrics||[]).length;
  const gridClass = n<=4 ? 'grid cols-4' : 'grid';
  const cards = (metrics||[]).map(m=>{
    const lab = displayLabel(m.label, mode==='24h'?'daily':mode);
    const val = modeValue(m, mode);
    const unavailable = modeUnavailable(m, mode);
    const dir = mode==='24h' ? (m.direction_daily||m.direction_24h) : m.direction;
    const pct = mode==='24h' ? (m.pct_daily!=null?m.pct_daily:m.pct_24h) : m.mtd_pct;
    const showPill = !unavailable && isComparable(m, mode);
    let note = '';
    if(m.label==='AUM' || m.point_in_time){
      note = `<div class="na-note">${esc(m.note||'Point-in-time at fetch — not historical midnight AUM.')}</div>`;
    } else if(unavailable){
      note = `<div class="na-note">${esc(m.ftd_note || m.prior_note || 'Unavailable. Missing history is not shown as zero.')}</div>`;
    } else if(m.ftd_note){
      note = `<div class="na-note">${esc(m.ftd_note)}</div>`;
    } else if(mode==='mtd' && m.comparable_mtd===false && m.prior_note){
      note = `<div class="na-note">${esc(m.prior_note)}</div>`;
    } else if(mode==='24h' && m.pct_24h_contributors && m.pct_24h_contributors.length){
      const ex=(m.pct_24h_excluded||[]);
      note = `<div class="na-note">${ex.length?('% over '+esc(m.pct_24h_contributors.join(', '))+' (excl. '+esc(ex.join(', '))+': no prior-day data)'):'% = each exchange\'s completed day vs its preceding day'}</div>`;
    } else if(mode==='24h' && m.comparable_24h!==true && m.label!=='AUM'){
      note = `<div class="na-note">${esc(m.prior_note || 'No comparable prior day. Missing history is not zero.')}</div>`;
    } else if(mode==='24h' && m.daily_day){
      const unver = m.cutoff_verified===false ? ' · user-selected convention' : '';
      note = `<div class="na-note">${esc(m.daily_day)} ${esc(m.reporting_timezone||'')}${unver}</div>`;
    } else if(mode==='mtd' && m.prior_note && !showPill){
      note = `<div class="na-note">${esc(m.prior_note)}</div>`;
    }
    const open = clickable && breakdownOpen && breakdownOpen.mode===mode && breakdownOpen.label===m.label;
    const cls = clickable ? `card clickable${open?' open':''}` : 'card';
    const attrs = clickable ? ` data-metric="${esc(m.label)}" data-mode="${esc(mode)}" role="button" tabindex="0"` : '';
    const hint = clickable ? `<div class="tap-hint">${open?'Hide':'Tap for'} exchange breakdown</div>` : '';
    const bd = open ? renderBreakdown(m.label, mode) : '';
    return `<div class="${cls}"${attrs}>
      <div class="label"><span>${esc(lab)}</span></div>
      <div class="big">${unavailable ? '<span style="color:var(--faint)">—</span>' : fmt(val, m.fmt)}${showPill ? ' '+pill(dir, pct) : ''}</div>
      ${note}${hint}${bd}
    </div>`;
  }).join('');
  return `<div class="${gridClass}">${cards}</div>`;
}

function renderBreakdown(label, mode){
  const bd = ((DATA.all||{}).breakdown||{})[mode==='24h'?'24h':'mtd'] || {};
  const rows = bd[label] || [];
  if(!rows.length) return `<div class="breakdown"><div style="color:var(--faint);font-size:.85rem">No exchange breakdown</div></div>`;
  const body = rows.map(r=>{
    const showP = r.comparable !== false && r.pct!==null && r.pct!==undefined;
    const dayBit = r.daily_day ? ` <span style="color:var(--faint);font-weight:500;font-size:.75rem">${esc(r.daily_day)}${r.reporting_timezone?' '+esc(r.reporting_timezone):''}${r.cutoff_verified===false?' · unverified':''}</span>` : (r.mtd_label?` <span style="color:var(--faint);font-weight:500;font-size:.75rem">${esc(r.mtd_label)}</span>`:'');
    return `<div class="bd-row">
      <img src="${esc(r.logo||('assets/exchanges/'+r.id+'.png'))}" alt="${esc(r.name)}" width="28" height="28"/>
      <span class="bd-name">${esc(r.name)}${dayBit}</span>
      <span class="bd-val">${fmt(r.value, r.fmt)}${showP?' '+pill(r.direction, r.pct):''}</span>
    </div>`;
  }).join('');
  return `<div class="breakdown">${body}</div>`;
}

function dailySeries(block){
  return (block.daily||[]).slice().sort((a,b)=>String(a.day).localeCompare(String(b.day)));
}

function seriesValue(r, field){
  if(field==='signups') return (r.signups_direct||0)+(r.signups_indirect||0);
  if(field==='ftds'){
    if(r.ftds==null || r.ftds_quality==='unavailable') return null;
    return Number(r.ftds);
  }
  return Number(r[field]||0);
}
function periodTotal(rows, field, kind){
  if(field==='ftds' && rows.some(r=>seriesValue(r, field)==null)) return 'unavailable';
  let s=0;
  for(const r of rows){
    const v = seriesValue(r, field);
    s += v==null ? 0 : v;
  }
  return compactFmt(s, kind);
}

function labeledBars(rows, field, color, kind){
  if(!rows.length) return '<div style="color:var(--faint);padding:24px 0">No data</div>';
  const vals = rows.map(r=>seriesValue(r, field));
  if(field==='ftds' && vals.every(v=>v==null)){
    return '<div class="na-note">Unavailable for this range. Historic first deposits are not proven, so they are not shown as zero.</div>';
  }
  const n = rows.length;
  const crowded = n > 14;
  const rotate = n > 10;
  const w = Math.max(560, n * (crowded ? 28 : 36));
  const padL=8, padR=8, padT=28, padB = rotate ? 52 : 36;
  const h = 220;
  const gap = crowded ? 4 : 8;
  const barW = Math.max(6, (w - padL - padR - gap*(n-1)) / n);
  const max = Math.max(...vals, 1);
  let bars='';
  rows.forEach((r,i)=>{
    const v = vals[i]==null ? 0 : vals[i];
    const missing = vals[i]==null;
    const x = padL + i*(barW+gap);
    const bh = Math.max(v>0?3:0, (v/max)*(h-padT-padB));
    const y = h - padB - bh;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="${Math.min(4, barW/2)}" fill="${color}" opacity=".92"/>`;
    const tip = missing ? '' : compactFmt(v, kind);
    const tipSize = crowded ? 8 : 10;
    if(barW >= 10 || !crowded){
      bars += `<text fill="#eef3fb" font-size="${tipSize}" font-weight="700" x="${x+barW/2}" y="${Math.max(12, y-5)}" text-anchor="middle">${esc(tip)}</text>`;
    } else {
      // Thin bars: rotate tip slightly above
      bars += `<text fill="#eef3fb" font-size="8" font-weight="700" x="${x+barW/2}" y="${Math.max(12, y-4)}" text-anchor="middle" transform="rotate(-55 ${x+barW/2} ${Math.max(12,y-4)})">${esc(tip)}</text>`;
    }
    const day = String(r.day||'');
    const short = day.length>=10 ? day.slice(5) : day; // MM-DD
    const lx = x+barW/2, ly = h-10;
    if(rotate){
      bars += `<text fill="#8fa0b8" font-size="${crowded?8:10}" font-weight="600" x="${lx}" y="${ly}" text-anchor="end" transform="rotate(-55 ${lx} ${ly})">${esc(short)}</text>`;
    } else {
      bars += `<text fill="#8fa0b8" font-size="10" font-weight="600" x="${lx}" y="${ly}" text-anchor="middle">${esc(short)}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}

function dailyTrends(block){
  const rows = dailySeries(block);
  if(!rows.length){
    return `<div class="section"><div class="section-head"><h2>Daily trends</h2></div>
      <div class="empty"><strong>No daily data yet</strong></div></div>`;
  }
  const charts = [
    {title:'Volume', field:'volume', color:'#14b8a6', kind:'money'},
    {title:'Commission', field:'commission', color:'#5b8cff', kind:'money'},
    {title:'Signups', field:'signups', color:'#f5c542', kind:'int'},
    {title:'FTDs', field:'ftds', color:'#f472b6', kind:'int'},
  ];
  const mixed = rows.some(r=>r.timezone_mixed);
  const tzs = [...new Set(rows.flatMap(r=>r.timezones||(r.timezone?[r.timezone]:[])))];
  const tzHint = mixed || tzs.length>1
    ? `Mixed TZs (${tzs.join(', ')}) — prefer per-exchange charts`
    : (tzs[0] ? `Reporting TZ ${tzs[0]}` : ((block.reporting||{}).reporting_timezone||''));
  const unver = (block.reporting && block.reporting.cutoff_verified===false)
    || (block.windows && block.windows.cutoff_verified===false);
  const cards = charts.map(c=>{
    const tot = periodTotal(rows, c.field, c.kind);
    const ftdNote = c.field==='ftds' && tot!=='unavailable' ? ' · not a proven zero when unavailable' : (c.field==='ftds' ? ' · not zero' : '');
    return `<div class="card chart-card">
      <div class="title"><span>${c.title}</span><span class="tot">Period total ${tot}${ftdNote}</span></div>
      ${labeledBars(rows, c.field, c.color, c.kind)}
    </div>`;
  }).join('');
  const extra = (block.windows&&block.windows.daily_trends_note) ? `<div class="hint" style="margin-top:8px">${esc(block.windows.daily_trends_note)}</div>` : '';
  return `
    <div class="section">
      <div class="section-head">
        <h2>Daily trends</h2>
        <div class="hint">${esc(rows[0].day)} → ${esc(rows[rows.length-1].day)} · ${esc(tzHint)}${unver?' · cutoff unverified':''}</div>
      </div>
      <div class="trend-charts">${cards}</div>
      ${extra}
    </div>`;
}

function barCompare(rows, field, color, moneyish){
  const w=560,h=200,padL=8,padR=8,padT=20,padB=36;
  const n=rows.length||1;
  const gap=18;
  const barW=Math.min(72, (w-padL-padR - gap*(n-1))/n);
  const connectedVals=rows.filter(r=>r.connected && r.value!=null).map(r=>r.value);
  const max=Math.max(...connectedVals, 1);
  let bars='';
  rows.forEach((r,i)=>{
    const x=padL + i*(barW+gap);
    const label=esc(r.name);
    if(!r.connected){
      bars += `<rect x="${x}" y="${padT}" width="${barW}" height="${h-padT-padB}" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(97,114,137,.45)" stroke-dasharray="4 3"/>`;
      bars += `<text class="bar-na" x="${x+barW/2}" y="${(padT+h-padB)/2+4}" text-anchor="middle">not connected</text>`;
    } else if(r.value==null){
      bars += `<rect x="${x}" y="${padT}" width="${barW}" height="${h-padT-padB}" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(97,114,137,.45)" stroke-dasharray="4 3"/>`;
      bars += `<text class="bar-na" x="${x+barW/2}" y="${(padT+h-padB)/2+4}" text-anchor="middle">unavailable</text>`;
    } else {
      const bh=Math.max(4, (r.value/max)*(h-padT-padB));
      const y=h-padB-bh;
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="8" fill="${color}" opacity=".9"/>`;
      const tip = moneyish ? compactMoney(r.value) : (Math.abs(r.value) < 100000 ? intfmt(r.value) : compactInt(r.value));
      bars += `<text fill="#eef3fb" font-size="11" font-weight="700" x="${x+barW/2}" y="${y-6}" text-anchor="middle">${esc(tip)}</text>`;
    }
    bars += `<text fill="#8fa0b8" font-size="11" font-weight="600" x="${x+barW/2}" y="${h-12}" text-anchor="middle">${label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${bars}</svg>`;
}

function exchangePanel(block){
  if(!block) return '<div class="empty"><strong>Unknown exchange</strong></div>';
  if(!block.connected){
    return `<div class="empty">
      <strong>${esc(block.name)}</strong>
      API not connected yet
    </div>`;
  }
  return `
    <div class="section" style="margin-top:14px">
      <div class="row-label">Daily · ${esc((block.windows&&(block.windows.daily_label||block.windows.last_24h_label))||'Latest completed day')}</div>
      ${metricCards(block.metrics_24h || block.metrics, '24h')}
    </div>
    <div class="section">
      <div class="row-label">Month to date · ${esc((block.windows&&block.windows.mtd_label)||'')}</div>
      ${metricCards(block.metrics_mtd || block.metrics, 'mtd')}
    </div>
    ${dailyTrends(block)}`;
}

function comparisonSection(){
  const period = comparePeriod;
  const rows = ((DATA.comparison||{})[period]) || [];
  const signupRows = rows.map(r=>({name:r.name, connected:r.connected, value:r.signups}));
  const revRows = rows.map(r=>({name:r.name, connected:r.connected, value:r.commission}));
  const rpsRows = rows.map(r=>({name:r.name, connected:r.connected, value:r.revenue_per_signup}));
  const windowHint = period==='all_time'
    ? ((DATA.comparison&&DATA.comparison.all_time_note) || 'All-time signups are lifetime direct referrals. Commission uses that same lifetime only when the history actually covers it.')
    : ((rows.find(r=>r.window_label)||{}).window_label || 'Month to date, same completed days for signups and commission');
  return `
    <div class="section" style="margin-top:32px">
      <div class="section-head">
        <h2>Exchange comparison</h2>
        <div class="seg" id="cmpSeg">
          <button type="button" data-p="mtd" class="${period==='mtd'?'on':''}">MTD</button>
          <button type="button" data-p="all_time" class="${period==='all_time'?'on':''}">All-time</button>
        </div>
      </div>
      <div class="hint" style="margin:-4px 0 10px">${esc(windowHint)}</div>
      <div class="charts">
        <div class="card chart-card"><div class="title"><span>Signups</span></div>${barCompare(signupRows,'signups','#14b8a6', false)}</div>
        <div class="card chart-card"><div class="title"><span>Commission</span></div>${barCompare(revRows,'commission','#5b8cff', true)}</div>
        <div class="card chart-card"><div class="title"><span>Commission per signup</span></div>${barCompare(rpsRows,'rps','#f5c542', true)}</div>
      </div>
    </div>`;
}

let DATA=null;
let selected='toobit';
let comparePeriod='mtd';
let breakdownOpen=null; // {mode, label}

function render(){
  const exchanges=DATA.exchanges||[];
  if(!exchanges.length){ document.getElementById('app').innerHTML='<p>No exchanges yet.</p>'; return; }
  if(!(DATA.by_exchange||{})[selected]) selected = exchanges[0].id;

  const tiles = exchanges.map(o=>{
    const on = o.id===selected ? 'on' : '';
    const st = o.connected ? 'live' : 'not connected';
    return `<button type="button" class="ex-tile ${on}" data-ex="${esc(o.id)}" aria-pressed="${o.id===selected}">
      <img src="${esc(o.logo||('assets/exchanges/'+o.id+'.png'))}" alt="${esc(o.name)}" width="44" height="44"/>
      <span class="nm">${esc(o.name)}</span>
      <span class="st">${st}</span>
    </button>`;
  }).join('');

  const all = DATA.all || {};
  const cadence = DATA.refresh_cadence || 'Twice daily at 08:00 and 15:00 Europe/Budapest';
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div>
        <div class="brand-row" style="margin:0 0 8px">
          <img class="brand-logo" src="assets/brand/logo-128.png" alt="100XClub" width="36" height="36" style="width:36px;height:36px"/>
          <h1>100XClub Partner Dashboard</h1>
        </div>
        <div class="sub">Last refresh ${esc(DATA.last_refresh||'')} · ${esc(cadence)}</div>
      </div>
      <div class="badge"><span class="dot"></span> Encrypted live totals</div>
    </div>

    <div class="section">
      <div class="section-head"><h2>All exchanges</h2><div class="hint">Tap a metric for per-exchange breakdown</div></div>
      <div class="row-label">Daily · ${(all.windows&&all.windows.daily_label)||'Latest completed reporting day'}</div>
      ${metricCards(all.metrics_24h || all.metrics, '24h', {clickable:true})}
      ${(all.windows&&all.windows.per_exchange_days&&all.windows.per_exchange_days.length)?`<div class="hint" style="margin:8px 0 0">${esc((all.windows.per_exchange_days||[]).join(' · '))}</div>`:''}
      <div class="section">
        <div class="row-label">Month to date · ${esc((all.windows&&all.windows.mtd_label)||'')}</div>
        ${metricCards(all.metrics_mtd || [], 'mtd', {clickable:true})}
      </div>
      ${dailyTrends(all)}
    </div>

    ${comparisonSection()}

    <div class="section" style="margin-top:36px">
      <div class="section-head"><h2>By exchange</h2></div>
      <div class="ex-tiles" id="exTiles">${tiles}</div>
      <div id="exPanel">${exchangePanel(DATA.by_exchange[selected])}</div>
    </div>
    <p class="footer">Client-side AES-GCM encryption. Numbers are not stored in plain HTML. Refreshed twice daily (08:00 &amp; 15:00 Europe/Budapest).</p>
  `;

  document.querySelectorAll('#exTiles .ex-tile').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selected = btn.getAttribute('data-ex');
      breakdownOpen = null;
      render();
    });
  });
  document.querySelectorAll('#cmpSeg button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      comparePeriod = btn.getAttribute('data-p');
      render();
    });
  });
  document.querySelectorAll('.card.clickable').forEach(card=>{
    const toggle=()=>{
      const label=card.getAttribute('data-metric');
      const mode=card.getAttribute('data-mode');
      if(breakdownOpen && breakdownOpen.label===label && breakdownOpen.mode===mode) breakdownOpen=null;
      else breakdownOpen={label, mode};
      render();
    };
    card.addEventListener('click', (e)=>{ e.preventDefault(); toggle(); });
    card.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); }});
  });
}

async function tryUnlock(){
  const err=document.getElementById('err');
  err.textContent='';
  const code=document.getElementById('code').value.trim();
  if(!code){ err.textContent='Enter the access code.'; return; }
  try{
    DATA = await decryptPayload(code);
    selected = (DATA.exchanges||[]).find(e=>e.connected)?.id || (DATA.exchanges||[])[0]?.id || 'toobit';
    comparePeriod='mtd';
    breakdownOpen=null;
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    render();
  }catch(e){
    err.textContent='Wrong code or corrupt payload.';
  }
}
document.getElementById('unlock').addEventListener('click', tryUnlock);
document.getElementById('code').addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryUnlock(); });
</script>
